<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Morador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">

    <div class="card shadow-sm">
        <div class="card-body">

            <h1 class="mb-4">Cadastrar Morador</h1>

            <form method="post">
                {% csrf_token %}
                
                <div class="mb-3">
                    {{ form.nome.label_tag }}
                    {{ form.nome }}
                </div>

                <div class="mb-3">
                    {{ form.nis.label_tag }}
                    {{ form.nis }}
                </div>

                <div class="mb-3">
                    {{ form.telefone.label_tag }}
                    {{ form.telefone }}
                </div>

                <div class="mb-3">
                    {{ form.endereco.label_tag }}
                    {{ form.endereco }}
                </div>

                <div class="form-check mb-3">
                    {{ form.ativo }}
                    {{ form.ativo.label_tag }}
                </div>

                <button type="submit" class="btn btn-success">Salvar</button>
                <a href="/moradores/" class="btn btn-secondary">Voltar</a>

            </form>

        </div>
    </div>

</div>

</body>
</html>
