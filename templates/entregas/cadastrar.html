<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Entrega</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">

    <div class="card shadow-sm">
        <div class="card-body">

            <h1 class="mb-4">Registrar Entrega</h1>

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    {{ form.morador.label_tag }}
                    {{ form.morador }}
                </div>

                <div class="mb-3">
                    {{ form.data_entrega.label_tag }}
                    {{ form.data_entrega }}
                </div>

                <div class="mb-3">
                    {{ form.quantidade.label_tag }}
                    {{ form.quantidade }}
                </div>

                <button type="submit" class="btn btn-success">Salvar</button>
                <a href="/entregas/" class="btn btn-secondary">Voltar</a>

            </form>

        </div>
    </div>

</div>

</body>
</html>
