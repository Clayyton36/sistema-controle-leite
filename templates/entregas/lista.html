<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entregas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Entregas</h1>
        <a href="/entregas/novo/" class="btn btn-primary">Nova Entrega</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <!-- FILTRO -->
        <form method="get" class="mb-3">
            <div style="display: flex; gap: 10px; align-items: center;">
                <input type="date" name="data" value="{{ data_filtro }}" class="form-control" style="max-width: 200px;">
                <button type="submit" class="btn btn-primary">Filtrar</button>
                <a href="{% url 'lista_entregas' %}" class="btn btn-secondary">Limpar</a>
            </div>
        </form>

        <!-- RESUMO -->
        <div class="mb-3">
            <strong>Total de pessoas:</strong> {{ total_pessoas }} <br>
            <strong>Total de leite entregue:</strong> {{ total_leite }}
        </div>


            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Morador</th>
                        <th>Data</th>
                        <th>Quantidade</th>
                    </tr>
                </thead>
                <tbody>
                    {% for entrega in entregas %}
                    <tr>
                        <td>{{ entrega.morador.nome }}</td>
                        <td>{{ entrega.data_entrega }}</td>
                        <td>{{ entrega.quantidade }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>

        </div>
    </div>

    <div class="mt-3">
        <a href="/" class="btn btn-secondary">Voltar</a>
    </div>

</div>

</body>
</html>
